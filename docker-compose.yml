services:
  postgres:
    image: postgres:16-alpine
    container_name: etransport-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etransport}
      POSTGRES_USER: ${POSTGRES_USER:-etransport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etransport_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etransport} -d ${POSTGRES_DB:-etransport}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  redis:
    image: redis:7-alpine
    container_name: etransport-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  minio:
    image: minio/minio:latest
    container_name: etransport-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: etransport-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-etransport};Username=${POSTGRES_USER:-etransport};Password=${POSTGRES_PASSWORD:-etransport_secret}
      ConnectionStrings__Redis: redis:6379
      Jwt__Secret: ${JWT_SECRET:-ETransportSuperSecretKey2026Minimum32Chars!}
      Jwt__Issuer: ${JWT_ISSUER:-ETransport}
      Jwt__Audience: ${JWT_AUDIENCE:-ETransportClient}
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MinIO__Bucket: ${MINIO_BUCKET:-etransport-files}
      Cors__Origins: ${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://e-transport.sgcc.uz,https://e-transport.sgcc.uz,http://172.16.90.62,http://172.16.90.62:5173}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      OneCScales__BaseUrl: ${ONEC_SCALES_URL:-}
      OneCScales__Username: ${ONEC_SCALES_USER:-}
      OneCScales__Password: ${ONEC_SCALES_PASSWORD:-}
      QrLink__BaseUrl: ${QRLINK_BASE_URL:-http://172.16.90.54:8080/api/documents/register}
      QrLink__VerificationBaseUrl: ${QRLINK_VERIFICATION_BASE_URL:-https://qrlink.sgcc.uz/verify}
      QrLink__SourceSystem: ${QRLINK_SOURCE_SYSTEM:-E-TRANPORT}
      QrLink__ApiKey: ${QRLINK_API_KEY:-ql_e-tranport_f47f11a234d4409b8e950c5bd7a20bcd}
      QrLink__Enabled: ${QRLINK_ENABLED:-true}
      DataProtection__KeysPath: /var/etransport/dp-keys
      FileStorage__Root: /var/etransport/uploads
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-8984531185:AAE_Z0AzIs4IcDHbFtFug3WAUsf7QPYUbUk}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID:-948197737}
      Telegram__Enabled: ${TELEGRAM_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - dp_keys_data:/var/etransport/dp-keys
      - uploads_data:/var/etransport/uploads
    # Faqat localhost — tarmoqdan Swagger/API to‘g‘ridan-to‘g‘ri ochilmasin (nginx orqali /api)
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: etransport-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Faqat localhost — tarmoqdan to'g'ridan-to'g'ri ochilmasin, faqat nginx orqali (80)
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  nginx:
    image: nginx:alpine
    container_name: etransport-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      # Sfera Balance shlyuzi (faqat E-Transport login bilan)
      - "8010:8010"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  postgres_data:
  redis_data:
  minio_data:
  dp_keys_data:
  uploads_data:
