worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 30M;

    # Gzip siqishni yoqish — API va statik fayllarni 5-10 barobar kichraytiradi
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Nginx versiyasini yashirish (Server header'da versiya chiqmasligi uchun)
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Login'ga qarshi qo'pol kuch (brute-force) hujumlarini sekinlashtirish —
    # bitta IP'dan daqiqasiga ~10 ta urinish, portlashlar uchun 5 tagacha navbat.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name 172.16.90.62 etransport.sgcc.uz e-transport.sgcc.uz localhost;

        # Xavfsizlik sarlavhalari — barcha javoblarga qo'llanadi
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://172.16.90.54:8080 http://$host:8010 http://172.16.90.62:8010 http://etransport.sgcc.uz:8010 http://e-transport.sgcc.uz:8010; frame-src 'self' blob: http://$host:8010 http://172.16.90.62:8010 http://etransport.sgcc.uz:8010 http://e-transport.sgcc.uz:8010; object-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Login endpointi — brute-force va so'rovlar limitini qo'llash
        location /api/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            set $api_upstream "http://api:8080";
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_read_timeout 300s;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }


        # Normative documents API (stored in browser client storage)
        location /api/normative-docs {
            default_type application/json;
            return 200 "[]";
        }

        location /api/ {
            set $api_upstream "http://api:8080";
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
            proxy_read_timeout 300s;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location /hubs/ {
            set $api_upstream "http://api:8080";
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

                location ~* ^/(index[.]html|version[.]json)$ {
            set $frontend_upstream "http://frontend:80";
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        location / {
            set $frontend_upstream "http://frontend:80";
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://172.16.90.54:8080 http://$host:8010 http://172.16.90.62:8010 http://etransport.sgcc.uz:8010 http://e-transport.sgcc.uz:8010; frame-src 'self' blob: http://$host:8010 http://172.16.90.62:8010 http://etransport.sgcc.uz:8010 http://e-transport.sgcc.uz:8010; object-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        }
    }

    # ===== Sfera Balance shlyuzi (:8010) =====
    # Sfera alohida tizim (o'z konteynerida, portini tarmoqqa ochmaydi). Unga faqat shu yerdan,
    # E-Transport'ga login qilgan va sfera.view huquqi bor foydalanuvchi o'tadi (et_sfera cookie).
    server {
        listen 8010;
        server_name _;
        server_tokens off;
        client_max_body_size 10M;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Faqat E-Transport sahifasi ichida ochilishi mumkin
        add_header Content-Security-Policy "frame-ancestors 'self' http://$host https://$host http://172.16.90.62 http://etransport.sgcc.uz https://etransport.sgcc.uz http://e-transport.sgcc.uz https://e-transport.sgcc.uz" always;

        location = /__sfera_auth {
            internal;
            set $api_upstream "http://api:8080";
            proxy_pass $api_upstream/api/integrations/sfera/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
        }

        location / {
            auth_request /__sfera_auth;
            # E-Transport tekshiruvi: sfera.admin bo'lsa 1 — Sfera PIN so'ramaydi
            auth_request_set $sfera_admin $upstream_http_x_sfera_admin;
            # CRUD huquqlari: view,update,delete,admin (rolga berilganlari)
            auth_request_set $sfera_perms $upstream_http_x_sfera_perms;
            error_page 401 403 = @sfera_denied;
            error_page 502 503 504 = @sfera_down;

            set $sfera_upstream "http://sfera-balance:8010";
            proxy_pass $sfera_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Faqat shlyuz qo'yadi — mijoz yuborgan qiymat har doim ustidan yoziladi
            proxy_set_header X-Etransport-Admin $sfera_admin;
            proxy_set_header X-Etransport-Perms $sfera_perms;
            proxy_read_timeout 120s;
        }

        location @sfera_denied {
            default_type text/html;
            return 401 '<!doctype html><html lang="uz"><meta charset="utf-8"><title>Sfera Balance</title><body style="font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f5f7fa;color:#0f172a"><div style="text-align:center;max-width:420px;padding:24px"><h2 style="margin:0 0 8px">Kirish yopiq</h2><p style="color:#64748b;margin:0 0 16px">Sfera Balance faqat E-Transport tizimiga login va parol bilan kirgandan keyin ochiladi.</p><a href="http://$host/" style="color:#2563eb">E-Transport tizimiga kirish</a></div></body></html>';
        }

        location @sfera_down {
            default_type text/html;
            return 503 '<!doctype html><html lang="uz"><meta charset="utf-8"><title>Sfera Balance</title><body style="font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f5f7fa;color:#0f172a"><div style="text-align:center"><h2 style="margin:0 0 8px">Sfera Balance hozir mavjud emas</h2><p style="color:#64748b">Birozdan keyin qayta urinib ko&#8216;ring.</p></div></body></html>';
        }
    }
}
